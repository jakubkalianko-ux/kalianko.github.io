
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALIANKO | Elite Tech Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-green: #00ff41; --neon-blue: #0080ff; --neon-red: #ff3131; --bg-black: #050505; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-black); color: white; font-family: 'Fira Code', monospace; margin: 0; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; }
        header { padding: 40px 20px; text-align: center; width: 100%; }
        .typewriter h1 { color: var(--neon-green); font-size: 2.2rem; margin: 0; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon-green); border-right: 3px solid var(--neon-green); display: inline-block; white-space: nowrap; overflow: hidden; animation: typing 2s steps(15, end), blink 0.7s infinite; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { 50% { border-color: transparent } }
        
        .sale-banner { background: var(--neon-red); color: black; font-weight: bold; width: 100%; padding: 10px; text-align: center; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 20px var(--neon-red); }
        
        .shop-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; max-width: 1000px; width: 100%; padding: 20px; z-index: 1; }
        .product-card { background: rgba(10, 10, 10, 0.9); border: 1px solid #222; padding: 40px; text-align: center; transition: 0.3s; position: relative; overflow: hidden; }
        .product-card:hover { border-color: var(--neon-green); transform: translateY(-5px); }
        
        .old-price { text-decoration: line-through; color: #555; font-size: 1.2rem; display: block; }
        .price-tag { display: block; font-size: 2.8rem; font-weight: bold; margin: 10px 0; color: white; }
        
        .buy-btn { width: 100%; background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 15px; font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .buy-btn:hover { background: var(--neon-green); color: black; box-shadow: 0 0 20px var(--neon-green); }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #0a0a0a; border: 1px solid var(--neon-green); padding: 30px; max-width: 450px; width: 95%; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: var(--neon-green); font-family: 'Fira Code'; }
        .qr-box { background: white; padding: 10px; display: inline-block; border-radius: 10px; margin: 15px 0; }
        .qr-img { width: 220px; height: 220px; display: block; }
    </style>
</head>
<body>
    <div class="sale-banner">FLASH SALE: 48H ONLY - UP TO 80% OFF</div>
    <canvas id="matrix"></canvas>
    <header><div class="typewriter"><h1>KALIANKO_ROOT</h1></div></header>

    <div class="shop-container">
        <div class="product-card">
            <h2 style="color: var(--neon-green);">K-ENCRYPTOR</h2>
            <p>Military-grade Python encryption module.</p>
            <span class="old-price">499 CZK</span>
            <span class="price-tag" style="color: var(--neon-green);">99 CZK</span>
            <button class="buy-btn" onclick="openOrder('K-ENCRYPTOR', '99', 'var(--neon-green)')">ORDER & PAY</button>
        </div>
        <div class="product-card" style="border-color: var(--neon-blue);">
            <h2 style="color: var(--neon-blue);">K-AI_CORE</h2>
            <p>Advanced NLP neural core.</p>
            <span class="old-price">799 CZK</span>
            <span class="price-tag" style="color: var(--neon-blue);">199 CZK</span>
            <button class="buy-btn" style="border-color: var(--neon-blue); color: var(--neon-blue);" onclick="openOrder('K-AI_CORE', '199', 'var(--neon-blue)')">ORDER & PAY</button>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content" id="modal-box">
            <h2 id="order-title">> ORDER_ENTRY</h2>
            <p id="price-confirm" style="color: #888;"></p>
            
            <div class="qr-box">
                <img id="qr-img" src="" alt="QR Platba" class="qr-img">
            </div>

            <form action="https://formspree.io/f/xeenprvg" method="POST">
                <input type="hidden" name="product" id="prod-input">
                <input type="email" name="email" placeholder="TVŮJ EMAIL" required>
                <input type="text" name="ig" placeholder="INSTAGRAM (VOLITELNÉ)">
                <button type="submit" class="buy-btn">POTVRDIT PLATBU</button>
            </form>
            <p onclick="closeOrder()" style="cursor:pointer; color:#444; margin-top:15px; font-size:0.7rem;">[ ZAVŘÍT ]</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "01"; const fontSize = 14; const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41"; for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        function openOrder(name, price, color) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('order-title').innerText = "> " + name;
            document.getElementById('price-confirm').innerText = "Cena: " + price + " CZK (Účet: 4875022083/0800)";
            document.getElementById('prod-input').value = name + "_SALE";
            document.getElementById('modal-box').style.borderColor = color;
            const qrUrl = `https://api.paylibo.com/paylibo/generator/czech/image?accountNumber=4875022083&bankCode=0800&amount=${price}&currency=CZK&message=Objednavka_${name}`;
            document.getElementById('qr-img').src = qrUrl;
        }
        function closeOrder() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
