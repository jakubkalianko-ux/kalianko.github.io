<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALIANKO | Elite Tech Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-green: #00ff41; --neon-blue: #0080ff; --bg-black: #050505; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-black); color: white; font-family: 'Fira Code', monospace; margin: 0; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; }
        header { padding: 60px 20px; text-align: center; width: 100%; }
        .typewriter h1 { color: var(--neon-green); font-size: 2.5rem; margin: 0; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon-green); border-right: 3px solid var(--neon-green); display: inline-block; white-space: nowrap; overflow: hidden; animation: typing 2s steps(15, end), blink 0.7s infinite; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { 50% { border-color: transparent } }
        .shop-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; max-width: 1000px; width: 100%; padding: 20px; z-index: 1; }
        .product-card { background: rgba(10, 10, 10, 0.9); border: 1px solid #222; padding: 40px; position: relative; transition: 0.3s; text-align: center; }
        .product-card:hover { border-color: var(--neon-green); box-shadow: 0 0 30px rgba(0, 255, 65, 0.1); transform: translateY(-5px); }
        .price-tag { display: block; font-size: 2.2rem; font-weight: bold; margin: 20px 0; color: #eee; }
        .buy-btn { width: 100%; background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 15px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .buy-btn:hover { background: var(--neon-green); color: black; box-shadow: 0 0 20px var(--neon-green); }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #0a0a0a; border: 1px solid var(--neon-green); padding: 40px; max-width: 450px; width: 90%; position: relative; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #000; border: 1px solid #333; color: var(--neon-green); font-family: 'Fira Code'; }
        #qr-section { display: none; margin-top: 10px; }
        .qr-img { width: 240px; height: 240px; border: 8px solid white; margin: 15px auto; display: block; border-radius: 5px; }
        footer { padding: 50px; color: #333; font-size: 0.7rem; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <header><div class="typewriter"><h1>KALIANKO_ROOT</h1></div></header>

    <div class="shop-container">
        <div class="product-card">
            <h2 style="color: var(--neon-green);">K-ENCRYPTOR</h2>
            <p>Military-grade Python encryption module.</p>
            <span class="price-tag">499 CZK</span>
            <button class="buy-btn" onclick="openOrder('K-ENCRYPTOR', 'var(--neon-green)')">ORDER & PAY</button>
        </div>
        <div class="product-card" style="border-color: var(--neon-blue);">
            <h2 style="color: var(--neon-blue);">K-AI_CORE</h2>
            <p>Advanced NLP neural core.</p>
            <span class="price-tag">799 CZK</span>
            <button class="buy-btn" style="border-color: var(--neon-blue); color: var(--neon-blue);" onclick="openOrder('K-AI_CORE', 'var(--neon-blue)')">ORDER & PAY</button>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content" id="modal-box">
            <h2 id="order-title">> ORDER_ENTRY</h2>
            <form id="purchase-form" action="https://formspree.io/f/xeenprvg" method="POST" onsubmit="showQR(event)">
                <input type="hidden" name="product" id="prod-input">
                <input type="email" name="email" placeholder="ENTER_EMAIL_ADDRESS" required>
                <input type="text" name="ig" placeholder="INSTAGRAM_HANDLE">
                <button type="submit" class="buy-btn">Confirm & Show QR</button>
            </form>
            <div id="qr-section">
                <p style="color: var(--neon-green);">[ REQUEST_LOGGED ]</p>
                <p>Naskenuj QR kód pro platbu:</p>
                <img src="https://i.postimg.cc/mD8m8vS3/qr-kalianko.jpg" alt="QR Platba" class="qr-img">
                <p style="font-size: 0.75rem;">Po zaplacení ti soubor přijde na email. Kontroluj i SPAM.</p>
                <button class="buy-btn" onclick="closeOrder()">HOTOVO</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "0101"; const fontSize = 14; const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41"; for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);
        function openOrder(name, color) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('order-title').innerText = "> " + name;
            document.getElementById('prod-input').value = name;
            document.getElementById('modal-box').style.borderColor = color;
            document.getElementById('purchase-form').style.display = 'block';
            document.getElementById('qr-section').style.display = 'none';
        }
        function showQR(event) {
            const form = event.target;
            fetch(form.action, { method: form.method, body: new FormData(form), headers: { 'Accept': 'application/json' } });
            event.preventDefault();
            document.getElementById('purchase-form').style.display = 'none';
            document.getElementById('qr-section').style.display = 'block';
        }
        function closeOrder() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
